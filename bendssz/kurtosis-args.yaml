# ethereum-package args: 2 Prysm CL nodes built from the bend-ssz-ffi branch (bendssz tag) +
# 1 Lighthouse peer that produces independently encoded SSZ. CL 1 runs in shadow mode (every
# message decoded through C is also decoded with fastssz and compared, strictly); CL 2 uses the C
# path alone (no shadow), so its chain state is built only from FFI-decoded objects. Mainnet preset (bend-ssz's types are mainnet
# only), Fulu from genesis, 6 s slots.
participants:
  - el_type: geth
    cl_type: prysm
    cl_image: prysm-beacon-chain:bendssz-dev
    vc_type: prysm
    vc_image: prysm-validator:bendssz-dev
    cl_extra_env_vars:
      BENDSSZ_SHADOW: "1"
      BENDSSZ_STRICT: "1"
      BENDSSZ_LOG: "1"
    validator_count: 32
    supernode: true
  - el_type: geth
    cl_type: prysm
    cl_image: prysm-beacon-chain:bendssz-dev
    vc_type: prysm
    vc_image: prysm-validator:bendssz-dev
    cl_extra_env_vars:
      BENDSSZ_LOG: "1"
    validator_count: 32
  - el_type: geth
    cl_type: lighthouse
    vc_type: lighthouse
    validator_count: 32
network_params:
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 60
  fulu_fork_epoch: 0
  electra_fork_epoch: 0
  deneb_fork_epoch: 0
additional_services:
  - spamoor
spamoor_params:
  start_chainload: true   # a mix of ordinary transactions (puts transactions into the blocks)
  defaults:
    - blob-average        # blob transactions (puts blob commitments into the blocks, data column sidecars on gossip)
